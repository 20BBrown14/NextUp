[pytest]
# Use importlib import mode so test modules are imported by file path rather
# than by munging sys.path. This avoids collisions between test modules that
# share a basename and keeps the project package importable.
addopts = --import-mode=importlib

# Where to look for tests.
testpaths = tests

# Discovery patterns. The conventional "test_*.py" pattern is included; the
# legacy "*.test.py" pattern is kept so either naming style is picked up.
python_files = test_*.py *_test.py *.test.py
python_classes = Test*
python_functions = test_*
