name: nextup-test

services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: nextup_test_jellyfin
    user: "1000:1000"
    ports:
      - "8096:8096"
    volumes:
      - jellyfin_config:/config
      - jellyfin_cache:/cache
      - ./data/recommendations:/recommendations
    restart: unless-stopped

  nextup:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: nextup_test_server
    depends_on:
      - jellyfin
    ports:
      - "8888:8888"
    env_file: config.test.env
    user: "1000:1000"
    environment:
      - APP_HOST=0.0.0.0
      - APP_PORT=8888
      - ENV=dev
    volumes:
      - ./data/recommendations:/recommendations
      - ../../movie.mp4:/movie.mp4:ro

volumes:
  jellyfin_config:
  jellyfin_cache:
